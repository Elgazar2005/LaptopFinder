<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laptop Details | LaptopFinder</title>
    <link href="./src/style/output.css" rel="stylesheet" />
  </head>
  <body
    class="bg-background text-heading dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300"
  >
    <header
      class="bg-white border-b border-slate-200 dark:bg-slate-800 dark:border-slate-700"
    >
      <nav
        class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <a href="index.html" class="text-2xl font-bold text-primary">
          LaptopFinder
        </a>

        <div class="hidden md:flex items-center gap-8">
          <a
            href="index.html"
            class="text-slate-600 dark:text-slate-300 hover:text-primary"
            >Home</a
          >
          <a
            href="laptops.html"
            class="text-slate-600 dark:text-slate-300 hover:text-primary"
            >Laptops</a
          >
          <a
            href="favorites.html"
            class="text-slate-600 dark:text-slate-300 hover:text-primary"
            >Favorites</a
          >
          <a
            href="compare.html"
            class="text-slate-600 dark:text-slate-300 hover:text-primary"
            >Compare</a
          >
        </div>

        <button
          id="themeToggle"
          class="border border-slate-200 dark:border-slate-600 dark:bg-slate-700 rounded-xl px-4 py-2 hover:bg-slate-100 dark:hover:bg-slate-600"
        >
          🌙
        </button>
      </nav>
    </header>

    <section class="max-w-7xl mx-auto px-6 pt-8">
      <div class="text-sm text-slate-500 dark:text-slate-400">
        <a href="index.html" class="hover:text-primary">Home</a>
        <span class="mx-2">/</span>
        <a href="laptops.html" class="hover:text-primary">Laptops</a>
        <span class="mx-2">/</span>
        <span class="text-heading dark:text-white font-medium"
          >Laptop Details</span
        >
      </div>
    </section>

    <main class="max-w-7xl mx-auto px-6 py-10">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
        <!-- Laptop Image -->
        <div
          class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-3xl p-8 flex items-center justify-center"
        >
          <img
            id="laptopImage"
            alt="Laptop"
            class="w-full max-w-lg object-contain"
          />
        </div>

        <!-- Laptop Information -->
        <div class="flex flex-col justify-center">
          <span
            id="laptopCategory"
            class="text-primary font-semibold text-sm mb-3"
          >
    
          </span>

          <h1 id="laptopName" class="text-3xl md:text-4xl font-bold mb-4">
 
          </h1>

          <p
            id="laptopDescription"
            class="text-slate-500 dark:text-slate-400 leading-7 mb-6"
          >

          </p>

          <div id="laptopPrice" class="text-3xl font-bold text-primary mb-8">
            
          </div>
          <div class="grid grid-cols-2 gap-4 mb-8">
            <div
              class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4"
            >
              <p class="text-sm text-slate-500 dark:text-slate-400 mb-2">
                Processor
              </p>
              <p id="laptopCpu" class="font-semibold"></p>
            </div>

            <div
              class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4"
            >
              <p class="text-sm text-slate-500 dark:text-slate-400 mb-2">RAM</p>
              <p id="laptopRam" class="font-semibold"></p>
            </div>

            <div
              class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4"
            >
              <p class="text-sm text-slate-500 dark:text-slate-400 mb-2">
                Storage
              </p>
              <p id="laptopStorage" class="font-semibold"></p>
            </div>

            <div
              class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl p-4"
            >
              <p class="text-sm text-slate-500 dark:text-slate-400 mb-2">
                Battery
              </p>
              <p id="laptopBattery" class="font-semibold"></p>
            </div>
          </div>
          <div class="flex flex-wrap gap-4">
            <button id="favoriteBtn" class="btn-action">
              ♡ Add to Favorites
            </button>

            <button
              id="compareBtn"
              class="border border-primary text-primary rounded-xl px-6 py-3 font-semibold hover:bg-green-50 dark:hover:bg-slate-700 transition"
            >
              + Add to Compare
            </button>
          </div>
        </div>
      </div>
      <section class="mt-20">
        <h2 class="section-title mb-8">Full Specifications</h2>

        <div
          class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl overflow-hidden"
        >
          <table class="w-full text-left">
            <tbody>
              <tr class="border-b border-slate-200 dark:border-slate-700">
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  Brand
                </th>
                <td id="specBrand" class="p-5 font-semibold">Lenovo</td>
              </tr>

              <tr class="border-b border-slate-200 dark:border-slate-700">
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  Category
                </th>
                <td id="specCategory" class="p-5 font-semibold"></td>
              </tr>

              <tr class="border-b border-slate-200 dark:border-slate-700">
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  Processor
                </th>
                <td id="specCpu" class="p-5 font-semibold"></td>
              </tr>

              <tr class="border-b border-slate-200 dark:border-slate-700">
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  RAM
                </th>
                <td id="specRam" class="p-5 font-semibold"></td>
              </tr>

              <tr class="border-b border-slate-200 dark:border-slate-700">
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  Storage
                </th>
                <td id="specStorage" class="p-5 font-semibold"></td>
              </tr>

              <tr class="border-b border-slate-200 dark:border-slate-700">
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  Battery
                </th>
                <td id="specBattery" class="p-5 font-semibold"></td>
              </tr>

              <tr class="border-b border-slate-200 dark:border-slate-700">
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  Weight
                </th>
                <td id="specWeight" class="p-5 font-semibold"></td>
              </tr>

              <tr>
                <th class="p-5 text-slate-500 dark:text-slate-400 font-medium">
                  Screen Size
                </th>
                <td id="specScreen" class="p-5 font-semibold"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer
      class="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 mt-20"
    >
      <div class="max-w-7xl mx-auto px-6 py-8 text-center">
        <p class="text-slate-500 dark:text-slate-400">
          © 2026 LaptopFinder. Find the perfect laptop for you.
        </p>
      </div>
    </footer>
    <script type="module" src="./src/js/details.js"></script>
  </body>
</html>
